[workspace]
resolver = "2"
members = [
  "crates/ts4accel-core",
  "crates/ts4accel-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
bincode = "1.3"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
globset = "0.4"
memmap2 = "0.9"
notify = "8.0"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "2.0"
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
